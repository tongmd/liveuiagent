<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">LiveUIAgent system design</title><desc id="desc">Personal interface, authenticated orchestration, six reasoning harnesses and durable account scoped state form a closed interaction loop.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#526477" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#233449}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#526477}.label{font-size:18px;font-weight:700}.body{font-size:16px}.lane{font-size:17px;font-weight:700;letter-spacing:1px}.edge{fill:none;stroke:#526477;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1600" height="1160" fill="#f7f9fc"/><text x="46" y="53" class="title">LiveUIAgent · Personal agents that keep learning</text><text x="46" y="84" class="sub">Generate → interact → revise → remember → return. The host owns actions and durable state.</text><rect x="32" y="110" width="1536" height="170" rx="12" fill="#eaf1ff" stroke="#d1dae4"/><text x="52" y="139" class="lane">01  PERSONAL AGENT INTERFACE</text><rect x="55" y="160" width="275" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="72" y="188" class="label">Preview &amp; library</text><text x="72" y="213" class="body">Latest saved data / visuals</text><text x="72" y="235" class="body">Open the same application</text><rect x="355" y="160" width="275" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="372" y="188" class="label">Unified entry</text><text x="372" y="213" class="body">User goal + harness + model</text><text x="372" y="235" class="body">Create or change an app</text><rect x="655" y="160" width="275" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="672" y="188" class="label">Live application</text><text x="672" y="213" class="body">Forms · actions · 3D · plots</text><text x="672" y="235" class="body">Inputs and natural-language edits</text><rect x="955" y="160" width="275" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="972" y="188" class="label">Interaction panel</text><text x="972" y="213" class="body">Original request · progress</text><text x="972" y="235" class="body">Engine · saved result · error</text><rect x="1255" y="160" width="275" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="1272" y="188" class="label">Memory controls</text><text x="1272" y="213" class="body">Inspect · correct · forget</text><text x="1272" y="235" class="body">Enable / disable learning</text><path d="M492 252V289H225V350" class="edge"/><path d="M792 252V289H225" class="edge"/><rect x="32" y="300" width="1536" height="320" rx="12" fill="#eaf7f3" stroke="#d1dae4"/><text x="52" y="329" class="lane">02  LIVEUIAGENT HOST · ACCOUNT AND APPLICATION BOUNDARIES</text><rect x="55" y="350" width="340" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="72" y="378" class="label">Authenticate &amp; resolve</text><text x="72" y="403" class="body">Owner · app ID · request ID · version</text><text x="72" y="425" class="body">New default / existing app harness</text><rect x="425" y="350" width="360" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="442" y="378" class="label">Prepare personal context</text><text x="442" y="403" class="body">Current request + saved app state</text><text x="442" y="425" class="body">Relevant preferences + user evidence</text><rect x="815" y="350" width="330" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="832" y="378" class="label">Route the interaction</text><text x="832" y="403" class="body">Create / task / revision / view event</text><text x="832" y="425" class="body">Local view controls need no model</text><rect x="1175" y="350" width="365" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="1192" y="378" class="label">Validate before commit</text><text x="1192" y="403" class="body">Schema · permissions · current version</text><text x="1192" y="425" class="body">Verify saved effects; keep state on error</text><path d="M395 394H425" class="edge"/><path d="M785 394H815" class="edge"/><rect x="55" y="485" width="340" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="72" y="513" class="label">Generate orchestration</text><text x="72" y="538" class="body">UI · action goals · roles · data schema</text><text x="72" y="560" class="body">Native app and service workflows</text><rect x="425" y="485" width="360" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="442" y="513" class="label">Continue task workflow</text><text x="442" y="538" class="body">Read → plan → service tools → verify</text><text x="442" y="560" class="body">App-scoped records and tool permissions</text><rect x="815" y="485" width="330" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="832" y="513" class="label">Revise visual workspace</text><text x="832" y="538" class="body">Previous tree · records · view state</text><text x="832" y="560" class="body">Preserve untouched objects and data</text><rect x="1175" y="485" width="365" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="1192" y="513" class="label">Commit or recover</text><text x="1192" y="538" class="body">Same app identity · next saved version</text><text x="1192" y="560" class="body">Failure retains request and prior app</text><path d="M980 442V465H225V485" class="edge"/><path d="M605 465V485" class="edge"/><path d="M980 442V485" class="edge"/><path d="M1357 442V485" class="edge"/><path d="M225 577V595H1158V455H1357V442" class="edge"/><path d="M605 577V595" class="edge"/><path d="M980 577V595" class="edge"/><rect x="32" y="645" width="1536" height="225" rx="12" fill="#fff4e9" stroke="#d1dae4"/><text x="52" y="674" class="lane">03  UNIFIED INFERENCE CONTRACT · ORDERED CONVERSATION → VALIDATED TEXT / JSON</text><text x="55" y="702" class="sub">Selected adapter · matching API model · bounded capacity · deadlines · cancellation · explicit errors</text><rect x="55" y="720" width="225" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="72" y="748" class="label">LiveUIAgent</text><text x="72" y="773" class="body">Native orchestration</text><text x="72" y="795" class="body">Configured provider API</text><rect x="300" y="720" width="225" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="317" y="748" class="label">Codex</text><text x="317" y="773" class="body">Authenticated relay</text><text x="317" y="795" class="body">Configured Codex model</text><rect x="545" y="720" width="225" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="562" y="748" class="label">DSH</text><text x="562" y="773" class="body">Official headless CLI</text><text x="562" y="795" class="body">DeepSeek API route</text><rect x="790" y="720" width="225" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="807" y="748" class="label">Qwen Code</text><text x="807" y="773" class="body">Official headless CLI</text><text x="807" y="795" class="body">Qwen API route</text><rect x="1035" y="720" width="225" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="1052" y="748" class="label">Kimi Code</text><text x="1052" y="773" class="body">Official headless CLI</text><text x="1052" y="795" class="body">Kimi API route</text><rect x="1280" y="720" width="260" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="1297" y="748" class="label">ZCode</text><text x="1297" y="773" class="body">Official headless CLI</text><text x="1297" y="795" class="body">GLM API route</text><text x="55" y="842" class="sub">CLI workers: private per-call configuration + loopback token; host forwards exact messages and retains production credentials.</text><path d="M605 577V645" class="edge"/><text x="620" y="632" class="sub">reasoning</text><rect x="32" y="900" width="1536" height="185" rx="12" fill="#edf0fa" stroke="#d1dae4"/><text x="52" y="929" class="lane">04  DURABLE ACCOUNT-SCOPED STATE</text><rect x="55" y="955" width="340" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="72" y="983" class="label">Applications</text><text x="72" y="1008" class="body">AppSpec / component tree / HTML</text><text x="72" y="1030" class="body">Identity · harness binding · version</text><rect x="425" y="955" width="360" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="442" y="983" class="label">Workflow state</text><text x="442" y="1008" class="body">Records · verified service effects</text><text x="442" y="1030" class="body">Interaction state · visual view state</text><rect x="815" y="955" width="330" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="832" y="983" class="label">Personal preferences</text><text x="832" y="1008" class="body">Condition · scope · evidence · expiry</text><text x="832" y="1030" class="body">Corrections replace matching memory</text><rect x="1175" y="955" width="365" height="92" rx="12" fill="#fff" stroke="#d1dae4"/><text x="1192" y="983" class="label">Execution history</text><text x="1192" y="1008" class="body">Jobs · original requests · progress</text><text x="1192" y="1030" class="body">Outcome / failure · retry context</text><path d="M1549 530H1556V937H1357V955" class="edge"/><text x="1482" y="924" class="sub">save</text><path d="M225 955V891H18V265H192V252" class="edge"/><path d="M980 955V885H1582V289H605V350" class="edge"/><text x="45" y="1128" class="sub">Saved versions refresh the app and preview. Preferences inform later requests. New-app settings never silently rebind existing apps.</text></svg>