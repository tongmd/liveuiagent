plugins { id 'com.android.application' }
android {
    namespace 'com.stonezhang.liveui'
    compileSdk 35
    defaultConfig {
        applicationId 'com.stonezhang.liveui'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'com.stonezhang.liveui.NativeTests'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
