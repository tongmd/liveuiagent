plugins { id 'com.android.application' }
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
    throw new GradleException('Gemma 4 uses LiteRT-LM 0.19.0. Build with JDK 21 or newer (JAVA_HOME).')
}
android {
    namespace 'com.stonezhang.liveui'
    compileSdk 35
    defaultConfig {
        applicationId 'com.stonezhang.liveui'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        if (project.findProperty('arm64Only') == 'true') { ndk { abiFilters 'arm64-v8a' } }
        testInstrumentationRunner 'com.stonezhang.liveui.NativeTests'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies { implementation 'com.google.ai.edge.litertlm:litertlm-android:0.19.0' }
