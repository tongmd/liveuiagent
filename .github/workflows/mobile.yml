name: Mobile apps
on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))
          devices=[d for v in data['devices'].values() for d in v if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not devices: raise SystemExit('No iPhone simulator installed')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('LIVEUI_SIMULATOR='+devices[0]['udid']+'\n')
          PY
      - name: Build and test iOS simulator
        run: |
          xcodebuild -project apps/mobile/ios/LiveUI.xcodeproj -scheme LiveUI \
            -destination "platform=iOS Simulator,id=$LIVEUI_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/liveui-simulator" \
            -resultBundlePath "$RUNNER_TEMP/liveui-tests.xcresult" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test
      - name: Launch native app
        run: |
          xcrun simctl bootstatus "$LIVEUI_SIMULATOR" -b
          xcrun simctl install "$LIVEUI_SIMULATOR" "$RUNNER_TEMP/liveui-simulator/Build/Products/Debug-iphonesimulator/LiveUI.app"
          xcrun simctl launch "$LIVEUI_SIMULATOR" com.stonezhang.liveui
          sleep 3
          mkdir -p mobile-artifacts
          xcrun simctl io "$LIVEUI_SIMULATOR" screenshot mobile-artifacts/ios-login.png
          xcrun simctl terminate "$LIVEUI_SIMULATOR" com.stonezhang.liveui
          xcrun simctl launch "$LIVEUI_SIMULATOR" com.stonezhang.liveui --preview-local-assistant
          sleep 3
          xcrun simctl io "$LIVEUI_SIMULATOR" screenshot mobile-artifacts/ios-local-assistant.png
          xcrun simctl terminate "$LIVEUI_SIMULATOR" com.stonezhang.liveui
          xcrun simctl launch "$LIVEUI_SIMULATOR" com.stonezhang.liveui --preview-devices
          sleep 3
          xcrun simctl io "$LIVEUI_SIMULATOR" screenshot mobile-artifacts/ios-devices.png
          ditto -c -k --keepParent "$RUNNER_TEMP/liveui-simulator/Build/Products/Debug-iphonesimulator/LiveUI.app" mobile-artifacts/liveUI-ios-simulator.zip
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project apps/mobile/ios/LiveUI.xcodeproj -scheme LiveUI \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/liveui-device" CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent "$RUNNER_TEMP/liveui-device/Build/Products/Release-iphoneos/LiveUI.app" mobile-artifacts/liveUI-ios-device-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: liveUI-ios
          path: mobile-artifacts/
          if-no-files-found: error
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build and inspect Android
        working-directory: apps/mobile/android
        run: |
          ./tests/run-policy-tests.sh
          ./tests/run-model-tests.sh
          ./tests/run-device-tests.sh
          ./gradlew --no-daemon -Parm64Only=true assembleDebug assembleDebugAndroidTest assembleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: liveUI-android-unsigned
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/*unsigned.apk
            apps/mobile/android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build Android emulator tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run real Android platform and WebView checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            mkdir -p mobile-artifacts
            adb install apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb install apps/mobile/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell am instrument -w com.stonezhang.liveui.test/com.stonezhang.liveui.NativeTests | tee mobile-artifacts/android-native-tests.txt
            adb logcat -d -b crash > mobile-artifacts/android-crash.txt
            adb exec-out run-as com.stonezhang.liveui cat files/android-devices.png > mobile-artifacts/android-devices.png
            adb exec-out run-as com.stonezhang.liveui cat files/android-devices-sensor.png > mobile-artifacts/android-devices-sensor.png
            adb exec-out run-as com.stonezhang.liveui cat files/android-login.png > mobile-artifacts/android-login.png || true
            adb exec-out run-as com.stonezhang.liveui cat files/android-local-assistant.png > mobile-artifacts/android-local-assistant.png || true
            adb exec-out run-as com.stonezhang.liveui cat files/android-local-keyboard.png > mobile-artifacts/android-local-keyboard.png || true
            grep -F 'OK (10 tests)' mobile-artifacts/android-native-tests.txt
      - name: Collect Android device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ulemi-android-device
          path: mobile-artifacts/
          if-no-files-found: warn
          retention-days: 7
