name: Android self-update
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/android/**'
      - '.github/workflows/android-update.yml'
  pull_request:
    paths:
      - 'apps/mobile/android/**'
      - '.github/workflows/android-update.yml'
permissions:
  contents: read
concurrency:
  group: android-update-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-self-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build two versions with the same disposable CI signing identity
        working-directory: apps/mobile/android
        run: |
          mkdir -p "$RUNNER_TEMP/update-fixtures"
          ./gradlew --no-daemon -PupdateVersionCode=1001 -PupdateVersionName=update-test-old assembleDebug assembleDebugAndroidTest
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/update-fixtures/old.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/update-fixtures/tests.apk"
          ./gradlew --no-daemon -PupdateVersionCode=1002 -PupdateVersionName=update-test-new assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/update-fixtures/new.apk"
          cp "$RUNNER_TEMP/update-fixtures/new.apk" "$RUNNER_TEMP/update-fixtures/wrong-signer.apk"
          keytool -genkeypair -keystore "$RUNNER_TEMP/other-test-key.jks" -storepass disposable-ci-only -keypass disposable-ci-only -alias fixture -dname 'CN=Disposable updater test' -keyalg RSA -keysize 2048 -validity 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/other-test-key.jks" --ks-key-alias fixture --ks-pass pass:disposable-ci-only "$RUNNER_TEMP/update-fixtures/wrong-signer.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real self-update and retained data on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: python3 apps/mobile/android/tests/run-update-device.py --fixtures "$RUNNER_TEMP/update-fixtures" --output update-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-actual-self-update
          path: update-artifacts/
          if-no-files-found: warn
          retention-days: 7
