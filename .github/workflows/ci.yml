name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --workspace @liveuiagent/dsh-plugin --include-workspace-root --no-audit --no-fund
      - run: npm test
        env:
          LIVEUIAGENT_CHROME_STARTUP_DIAGNOSTICS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-startup-diagnostics
          path: artifacts/chrome-startup/*.json
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run check:docs
      - run: npm run check:release
